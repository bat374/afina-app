name: Build Android APK

# Free alternative to EAS Build's cloud queue: runs `eas build --local` on GitHub's own Ubuntu
# runners (no macOS needed for Android). This still uses the project's real EAS-managed signing
# keystore (fetched live via EXPO_TOKEN, same identity as any past `eas build`), so the result
# installs as a normal update over an existing install instead of requiring an uninstall — unlike
# a bare `expo prebuild` + `gradlew assembleDebug`, which signs with a throwaway debug key that
# can never match a real install. Local execution isn't billed against EAS Build's cloud quota.
# Trigger manually from the Actions tab, or it runs automatically on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build signed APK (eas build --local)
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN not set — cannot fetch signing credentials. Add it as a repo secret."
            exit 1
          fi
          npx eas-cli build --local --platform android --profile preview --non-interactive --output ./afina.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: afina-apk
          path: afina.apk
          retention-days: 30

      # OTA (expo-updates): pushes JS/asset-only changes to already-installed apps without a new
      # APK. Only takes effect once a build with expo-updates embedded has been installed on the
      # phone — native/dependency changes still need a new APK from the job above regardless.
      # Requires an EXPO_TOKEN repo secret (Expo account → Settings → Access tokens); skipped
      # harmlessly if it isn't set yet.
      - name: Publish OTA update
        env:
          # Passed as an env var, not interpolated directly into the script: a commit message can
          # contain newlines or shell metacharacters, and ${{ }} expressions are substituted
          # textually before bash ever sees the line — that's a known script-injection vector, and
          # separately, a multi-line message here breaks the shell script's own quoting.
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN not set — skipping OTA publish. Add it as a repo secret to enable auto-updates."
            exit 0
          fi
          npx eas-cli channel:create production --non-interactive || true
          npx eas-cli update --branch production --message "Auto-publish ${COMMIT_SHA:0:7}" --non-interactive
